[workspace]
members = [
    "crates/haimen-core",
    "crates/haimen-lark",
    "crates/haimen-xiaozhi",
    "crates/haimen-claude-code",
    "crates/haimen-codex",
    "crates/haimen-openclaw",
    "crates/haimen-hermes",
    "crates/haimen-openai",
    ".",    # 根目录的主 crate
]

[package]
name = "haimen"
version = "0.12.1"
edition = "2024"
rust-version = "1.85"
description = "AI 网关基建 CLI"
license = "MIT"
repository = "https://github.com/shenjingnan/haimen"
include = [
    "/src/**/*",
    "/crates/**/*",
    "/build.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE*",
    "/README.md",
    "/web-ui/dist/**/*",
]

[workspace.dependencies]
# CLI 框架
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# 异步运行时
tokio = { version = "1", features = ["full"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# 错误处理
thiserror = "2"
anyhow = "1"

# Web 框架
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }

# 静态资源嵌入
rust-embed = "8"

# 时间处理
chrono = "0.4"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

# HTTP 客户端
reqwest = { version = "0.13", features = ["json", "stream"] }

# 异步流处理
futures-util = "0.3"
async-trait = "0.1"

# 固件 OTA：release zip 内是 deflate 压缩的 merged-bin，需要解压
flate2 = "1"

# MCP 协议
rmcp = { version = "2.2.0", features = ["client", "transport-child-process"] }
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"

# 钉钉集成
dingtalk-stream = "0.1.7"
tokio-util = "0.7"
tokio-stream = "0.1"
tempfile = "3"

# 自动打开浏览器
webbrowser = "1.0"

# 本地网络 IP 探测
local-ip-address = "0.6"

# UUID
uuid = { version = "1", features = ["v4"] }

# Opus 音频编码
opus2 = { version = "0.4", features = ["bundled"] }

# Ogg 容器封装（小智 notify 音频：Opus 帧打包成 Ogg 供设备 HTTP 拉取）
ogg = { version = "0.9.2", default-features = false }

# MQTT 客户端（小智设备的 MQTT 传输层，见 specs/mqtt-udp/实现方案.md）
rumqttc = "0.24"

# AES-CTR 对称加密（小智 UDP 音频通道的载荷加密）
aes = "0.8"
ctr = "0.9"

# 可执行文件路径解析（Windows 下按 PATHEXT 命中 npm 的 .cmd/.bat shim）
which = "8"


[dependencies]
# Silero VAD v5（ONNX 推理）：用神经网络判断人声，替代不可靠的能量阈值
# 模型内置在 crate 里，运行时不需要额外文件
voice_activity_detector = "0.2"
clap = { workspace = true }
clap_complete = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
rust-embed = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
flate2 = { workspace = true }
rmcp = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
dingtalk-stream = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }

# Workspace crate 依赖
haimen-core = { path = "crates/haimen-core", version = "0.1.2" }
haimen-lark = { path = "crates/haimen-lark", version = "0.2.2" }
haimen-xiaozhi = { path = "crates/haimen-xiaozhi", version = "0.1.5" }
haimen-claude-code = { path = "crates/haimen-claude-code", version = "0.2.0" }
haimen-codex = { path = "crates/haimen-codex", version = "0.2.0" }
haimen-openclaw = { path = "crates/haimen-openclaw", version = "0.2.0" }
haimen-hermes = { path = "crates/haimen-hermes", version = "0.2.0" }
haimen-openai = { path = "crates/haimen-openai", version = "0.1" }
univoice = { version = "0.1.6", features = ["opus-encoder"] }
opus2 = { workspace = true }
ogg = { workspace = true }
webbrowser = { workspace = true }
local-ip-address = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[profile.dist]
inherits = "release"
lto = "thin"
